    <style>
      /* Here, not in style.css: the game bundle brings that sheet, and a failed boot never loads it. boot.ts sets the theme tokens. */
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }

      body:has(#loading) > :not(#loading) {
        visibility: hidden;
      }

      #loading {
        position: fixed;
        inset: 0;
        z-index: 15;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        font: 600 14px "Inter", ui-sans-serif, system-ui, sans-serif;
        color: color-mix(in oklch, var(--foreground) 80%, transparent);
        background: var(--desktop);
      }

      #loading .version-tag {
        position: absolute;
        bottom: calc(env(safe-area-inset-bottom) + 24px);
        margin: 0;
      }

      #loading .logo {
        width: 96px;
        height: 88px;
        color: var(--primary);
        fill: currentColor;
      }

      #loading button {
        height: 32px;
        padding: 0 12px;
        font: inherit;
        font-size: 12px;
        color: var(--foreground);
        background: var(--background-light);
        border: 1px solid color-mix(in oklch, var(--foreground) 22%, transparent);
        border-radius: 8px;
        cursor: pointer;
      }

      #loading button:hover {
        background: var(--background-lighter);
      }

      #loading button:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
    </style>

        <button type="button" data-touch="rewind" aria-label="Rewind (hold)"><svg aria-hidden="true"><use href="#icon-rewind" /></svg></button>
        <button type="button" data-touch="reset" aria-label="Reset">Reset</button>
        <button type="button" data-touch="camera" aria-label="Camera">Cam</button>
      </div>
      <div class="touch-pedals">
        <div class="touch-brake">
          <div class="touch-key" data-touch="handbrake">Handbrake</div>
          <div class="pedal" data-touch="brake"><span>Brake</span></div>
        </div>
        <div class="touch-gas">
          <div class="pedal throttle" data-touch="throttle"><span>Gas</span></div>
        </div>
      </div>
    </div>

    <div class="dock-top">
      <div class="hud top-left">
        <div class="title">
          <span class="brand"><svg class="logo" aria-hidden="true"><use href="#logo-mark" /></svg>Harepin</span>
          <span class="dim">room <b id="room"></b></span>
        </div>
      </div>
      <div class="hud actions">
        <button type="button" id="menu-btn" class="icon-button" aria-label="Menu" title="Menu (Esc)"><svg aria-hidden="true"><use href="#icon-menu" /></svg></button>
        <button type="button" id="garage-btn" class="icon-button" aria-label="Garage" title="Garage"><svg aria-hidden="true"><use href="#icon-car" /></svg></button>
        <button type="button" id="settings-btn" class="icon-button" aria-label="Settings" title="Settings"><svg aria-hidden="true"><use href="#icon-settings" /></svg></button>
        <button type="button" id="career-btn" class="icon-button" aria-label="Career" title="Career"></button>
        <button type="button" id="chat-btn" class="icon-button" aria-label="Chat" title="Chat (T)" aria-expanded="false" aria-controls="chat-panel"><svg aria-hidden="true"><use href="#icon-chat" /></svg><span id="chat-unread" class="badge" hidden></span></button>
        <button type="button" id="modes-btn" aria-label="Modes" title="Modes"><svg aria-hidden="true"><use href="#icon-modes" /></svg><span>Modes</span></button>
        <button type="button" id="aids-btn" popovertarget="aids" aria-label="Driving aids" title="Driving aids"><svg aria-hidden="true"><use href="#icon-aids" /></svg></button>
        <div id="aids" popover role="group" aria-label="Driving aids">
          <button type="button" class="aid-row" data-aid="tcs" aria-pressed="true">Traction control</button>
          <button type="button" class="aid-row" data-aid="abs" aria-pressed="true">ABS</button>
          <button type="button" class="aid-row" data-aid="assist" aria-pressed="true">Steering assist</button>
          <button type="button" class="aid-row" data-aid="stability" aria-pressed="true">Stability</button>
          <button type="button" class="aid-row" data-aid="auto" aria-pressed="true">Auto gearbox</button>
        </div>
      </div>
      <div class="dock-break"></div>
      <div class="hud times" id="strip">
        <div class="lap"><svg class="event-icon" aria-hidden="true"><use href="#icon-modes" /></svg><span id="event-name" class="event-name"></span><span class="dim">lap</span><b id="lap"></b></div>
        <div><span class="dim">last</span><b id="last"></b></div>
        <div><span class="dim">best</span><b id="best"></b></div>
        <div id="gate"><span class="dim">gate</span><b id="cp"></b></div>
        <button type="button" id="restart-lap" class="icon-button" aria-label="Restart lap" title="Restart lap (L)"><svg aria-hidden="true"><use href="#icon-restart" /></svg></button>
      </div>
    </div>

    <div class="hud top-right">
      <div id="map-note" hidden><span>Next gate</span><b id="map-dist"></b></div>
      <canvas id="minimap"></canvas>
      <ol id="players"></ol>
      <button type="button" id="online-chip" hidden>
        <svg aria-hidden="true"><use href="#icon-people" /></svg>
        <span class="online-here"><b id="online-here">1</b> here</span>
        <span class="online-total"><b id="online-total">1</b><span class="online-word"> online</span></span>
      </button>
    </div>

    <div id="banner"></div>
    <div id="delta"></div>
    <div id="countdown"></div>
    <div id="race-panel" class="hud" hidden>
      <div id="race-status"></div>
      <ol id="race-results"></ol>
    </div>
    <div id="mode-status" class="hud" hidden></div>
    <div id="mode-hint" hidden aria-hidden="true"></div>
    <div id="mode-result" class="hud" hidden>
      <div id="mode-result-title"></div>
      <div id="mode-result-stars"></div>
      <div id="mode-result-lines"></div>
      <div id="mode-result-unlock"></div>
      <p id="mode-result-note" role="status" hidden></p>
      <div class="room-actions">
        <button type="button" id="mode-retry">Retry</button>
        <button type="button" id="mode-car" hidden>Change car</button>
        <button type="button" id="mode-next">Next level</button>
        <button type="button" id="mode-try" hidden>Try it in the garage</button>
        <button type="button" id="mode-exit">Free drive</button>
      </div>
    </div>
    <div id="toast" class="hud" role="status"><svg class="toast-icon" aria-hidden="true"><use href="#logo-mark" /></svg><span id="toast-label"></span><span id="toast-text"></span></div>
    <div id="rewind">◂◂ REWIND</div>

    <div class="dock-left">
      <div id="chat">
        <ol id="chat-log" aria-live="polite"></ol>
        <section id="chat-panel" aria-label="Chat" hidden>
          <header class="chat-head">
            <h2>Chat</h2>
            <button type="button" id="chat-close" class="icon-button" aria-label="Close chat" title="Close (Esc)"><svg aria-hidden="true"><use href="#icon-close" /></svg></button>
          </header>
          <ol id="chat-history" role="log"></ol>
          <div id="chat-empty">
            <p class="chat-alone">No one else here yet — copy the invite link</p>
            <p class="chat-quiet">No messages yet. Say hi.</p>
            <button type="button" id="chat-invite">Copy invite link</button>
          </div>
          <form id="chat-form">
            <input id="chat-input" type="text" maxlength="140" autocomplete="off" enterkeyhint="send" placeholder="Message" aria-label="Chat message" />
            <button type="submit">Send</button>
          </form>
        </section>
      </div>
    </div>

    <div class="hud bottom-right">
      <button type="button" id="recenter" class="icon-button" aria-label="Recenter camera" title="Recenter camera (F)"><svg aria-hidden="true"><use href="#icon-recenter" /></svg></button>
      <svg class="dial" viewBox="8 8 184 184" aria-hidden="true">
        <path class="dial-track" pathLength="100" d="M 47 153 A 75 75 0 1 1 153 153" />
        <path id="dial-zone" class="dial-zone" pathLength="100" d="M 47 153 A 75 75 0 1 1 153 153" />
        <path id="dial-fill" class="dial-fill" pathLength="100" d="M 47 153 A 75 75 0 1 1 153 153" />
        <path id="dial-hot" class="dial-hot" pathLength="100" d="M 47 153 A 75 75 0 1 1 153 153" />
      </svg>
      <div class="speedo">
        <span id="speed">0</span><span class="unit">km/h</span>
        <span id="gear" data-mode="A" title="Click to switch auto / manual gearbox (4)">1</span>
      </div>
      <div class="rpm"><div id="rpm-fill"></div><div id="shift"></div></div>
      <div class="nitro" id="nitro" hidden><span class="unit">nitro</span><div class="nitro-tank"><div id="nitro-fill"></div></div></div>
      <div class="assists" role="group" aria-label="Driving aids">
        <button type="button" class="aid-key" data-aid="tcs" aria-label="Traction control" aria-pressed="true" title="Traction control (1)">TC</button>
        <button type="button" class="aid-key" data-aid="abs" aria-label="ABS" aria-pressed="true" title="ABS (2)">ABS</button>
        <button type="button" class="aid-key" data-aid="assist" aria-label="Steering assist" aria-pressed="true" title="Steering assist (3)">Steer</button>
        <button type="button" class="aid-key" data-aid="stability" aria-label="Stability" aria-pressed="true" title="Stability (5)">STM</button>
        <button type="button" class="aid-key" data-aid="auto" aria-label="Auto gearbox" aria-pressed="true" title="Auto gearbox (4)">Auto</button>
      </div>
    </div>

    <script type="module" src="/src/boot.ts"></script>
  </body>
</html>
