const DATA = {"id": "harepin-career-v2", "title": "Harepin career ladder (round 2)", "date": "2026-11-11", "round": 2, "lang": "en", "lead": "Progression part 2, updated with what shipped since round 1. **Already decided:** Things to try teaches what exists; the career is a ladder of events built from existing modes; events unlock **tiers only**, cars and parts stay open.\n\n**New since round 1 (shapes the answers):**\n- **Worlds:** Mainland (6 km, default) + mini maps Island, Sky Track, Dune sea, Alpine, **Frozen lakes**; **Winter** season on any mini map; **Volcano** and **Rooftops** in progress, Ice canyon next.\n- **Create world + map codes:** any world is a short code (`1C…`). A fixed event map = a map code.\n- **Car classes D-X + PI** and garage **presets**; assist presets **Easy / Balanced / Pro**.\n- **Records reset** when a world's generator changes (Island v8 tonight). Fixed-seed events need an answer to that.\n- Decided earlier: Forza-style **race event markers** on Mainland and Island; a **pick-your-car step** before a mode starts.", "intro": "- Key decisions are marked; answer those first.\n- Round-1 questions are unchanged except where the new context changes the recommendation (B2, B4).\n- New questions are in **New since round 1**.\n- \"Use recommendations\" fills every open question with my pick.", "next": "Save as docs/brainstorm/2026-11-11_harepin-career-v2.answers.md. Resolve 'You decide', flag conflicts with docs/plan (biomes, special-maps) and src/goals, then write docs/plan/career.md (tiers, events as data with map code + class cap + assist rule, unlock rule, rewards, menu + map markers, version pinning) and spawn the build in phases.", "sections": [{"id": "shape", "title": "Shape of the ladder", "questions": [{"id": "A1", "key": true, "prompt": "How many tiers?", "options": [{"label": "3 tiers (Rookie, Club, Pro)", "desc": "Small enough to finish; easy to fill from existing modes", "rec": true, "value": "a"}, {"label": "5 tiers", "desc": "Longer arc, needs more events than we have content for today", "value": "b"}, {"label": "Open-ended, new tiers added over time", "desc": "Good for updates, never feels 'done'", "value": "c"}], "type": "single"}, {"id": "A2", "key": true, "prompt": "Events per tier?", "type": "number", "unit": "events", "min": 3, "max": 15, "rec": 6}, {"id": "A3", "prompt": "What unlocks the next tier?", "options": [{"label": "A star total in the current tier", "desc": "Flexible: skip an event you hate, 3-star others", "rec": true, "value": "a"}, {"label": "Finish every event (any stars)", "desc": "Simple, but one hard event blocks you", "value": "b"}, {"label": "Win the tier's final event", "desc": "Dramatic, single gate", "value": "c"}], "type": "single"}, {"id": "A4", "prompt": "Does a tier end with a showcase final event?", "options": [{"label": "Yes, a longer mixed final per tier", "desc": "Gives each tier a peak; it's one more event to design", "rec": true, "value": "a"}, {"label": "No, all events equal", "value": "b"}], "type": "single"}, {"id": "A5", "prompt": "Are events played in order inside a tier?", "options": [{"label": "Any order", "desc": "Lets players pick what they enjoy", "rec": true, "value": "a"}, {"label": "Fixed order", "desc": "Controls the difficulty curve", "value": "b"}], "type": "single"}]}, {"id": "events", "title": "What an event is", "background": "Today a mode level = mode + level (route or layout) on the current world/seed. Stars and best times are stored per mode level (`track.record`). An event would wrap that with extra rules.", "questions": [{"id": "B1", "key": true, "prompt": "Which modes feed the career?", "type": "matrix", "cols": ["Yes", "Later", "No"], "rows": [{"id": "race", "label": "Race (street, offroad, circuit)", "rec": "Yes"}, {"id": "gymkhana", "label": "Gymkhana", "rec": "Yes"}, {"id": "parking", "label": "Parking", "rec": "Yes"}, {"id": "drift", "label": "Drift zones", "rec": "Yes"}, {"id": "hunt", "label": "Gate hunt", "rec": "Yes"},
