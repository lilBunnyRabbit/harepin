t}.inline{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.inline input.field{width:auto;min-width:0;flex:0 1 260px}.unit{color:var(--muted);font-size:14px}textarea.other{border-color:color-mix(in srgb,var(--brand-primary) 50%,transparent)}textarea.note{--c: var(--brand-secondary);border-style:dashed;border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,var(--field));font-size:14px}textarea.note::placeholder{color:var(--brand-secondary)}.scale{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;font-size:13.5px;color:var(--muted)}.scale input{width:100%;accent-color:var(--brand-primary)}.scale.untouched input{opacity:.45}.scale output{min-width:3ch;text-align:right;font:600 14px var(--mono);color:var(--brand-foreground);font-variant-numeric:tabular-nums}@media(max-width:560px){.scale{grid-template-columns:1fr auto}.scale .lo,.scale .hi{display:none}}.matrix{display:grid;gap:4px}.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}.mrow:last-child{border-bottom:0}.mlabel{display:grid;gap:2px;min-width:0}.mlabel .odesc{font-size:13px}.mrow .seg button{position:relative}.mrow .seg button.recd:after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--brand-secondary)}@media(max-width:640px){.mrow{grid-template-columns:minmax(0,1fr)}}.extras{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}.flags{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:2px 10px;border-radius:999px;font-size:12.5px}.chip[aria-pressed=true]{border-color:var(--c)}.chip[data-flag=unsure][aria-pressed=true]{--c: var(--brand-warning)}.chip[data-flag=delegate][aria-pressed=true]{--c: var(--brand-secondary)}.chip[data-flag=skip][aria-pressed=true]{--c: var(--brand-foreground)}.extras .spacer{flex:1}.sugg{font-size:13px;color:var(--muted)}.sugg .link{color:var(--brand-secondary)}.finish{display:fle const DATA = {"id": "harepin-career-v3", "title": "Harepin career ladder (round 3)", "date": "2026-11-13", "round": 3, "lang": "en", "lead": "Progression part 3: what to build next and when to switch the career on. **Built, hidden behind `?career`:** C0-C4. That is 21 events as data, the career page, `?event=` links, the finish line + Next event, the Play strip card, the +2 s hit penalty, the class-capped car pick that restores your car afterwards, bot-tuned star times for race events and 3-star dev ghosts for race and duel events.\n\n**Changed since round 2:**\n- **Volcano** and **Big dunes** are now listed in the menus. Volcano's one-way descent (`descent`, \"Rim to sea\") exists.\n- **Rooftops is dropped** for now, so the Rookie final has no real home. It runs on its Sky Track stand-in.\n- **Ice canyon** is not built. The Pro final runs on a Frozen lakes stand-in.\n- **Mainland events** (c6, p1) still run on Island stand-ins, because modes refuse streamed worlds.\n- **Non-race stars** (gymkhana, parking, drift, hunt, duel) still use each mode's model par. Nothing hand-tuned yet.\n\n**Left in the plan:** C5 rewards, C6 world markers, C7 Mainland events, C8 share link, finals on their real maps.", "intro": "- Key decisions are marked; answer those first.\n- Already decided in round 2, not asked again: 3 tiers of 6 + final, star-total unlocks, any order, cosmetic rewards (paint at 10 stars, decal at 21/21, badge for the final), badge on the career page, own name label and players list, no assist rules.\n- \"Use recommendations\" fills every open question with my pick.", "next": "Save as docs/brainstorm/2026-11-13_harepin-career-v3.answers.md. Resolve 'You decide', flag conflicts with docs/plan/career.md and docs/plan/special-maps.md, update career.md (status, roster, rewards §1.4, markers §4, phases §7), then spawn the next phase in the order the release answer sets.", "sections": [{"id": "release", "title": "Release", "background": "Stars live in `harepin:career` with no version in the key, so they survive world bumps and stand-in swaps. Rewards are earned from star totals, so they can be granted from stars players already have. Best times and ghosts reset when a stand-in moves to its real map.", "questions": [{"id": "R1", "key": true, "type": "single", "prompt": "When does the career come out from behind `?career`?", "why": "Rewards are computed from stored stars, so stars earned before C5 still pay out when it lands.", "options": [{"label": "Now, with C0-C4. Rewards and markers follow", "value": "a", "desc": "Nothing earned is lost. Real play shows whether the gates are fair", "rec": true}, {"label": "After C5 rewards", "value": "b", "desc": "The first look has a payoff for the stars. About M of work first"}, {"label": "After C5 rewards and C6 markers", "value": "c", "desc": "The full Forza-style feel at launch. Two M phases first"}, {"label": "After C7, when Mainland events are real", "value": "d", "desc": "No stand-ins at launch. Waits on the heaviest phase (M-L, unverified)"}]}, {"id": "R2", "type": "matrix", "cols": ["Before release", "After", "Drop"], "prompt": "Which open items must land before the career is public?", "why": "Rows are the open items from `docs/plan/career.md`. My picks fit R1 = now.", "rows": [{"id": "nonrace", "label": "Hand-tuned stars for non-race events", "desc": "10 events still use mode par; a par that is too easy or too hard skews the 12/14 gates", "rec": "Before release"}, {"id": "volcano", "label": "Club final on its real Volcano map", "desc": "Data change + bot re-tune + new ghost (see F1)", "rec": "Before release"}, {"id": "drift", "label": "Drift point thresholds per event", "desc": "c2 and p3 use the mode's per-metre silver/gold", "rec": "Before release"}, {"id": "rewards", "label": "C5 rewards", "rec": "After"}, {"id": "markers", "label": "C6 world markers", "rec": "After"}, {"id": "share", "label": "C8 share link", "rec": "After"}]}]}, {"id": "rewards", "title": "Rewards (C5)", "backgro
